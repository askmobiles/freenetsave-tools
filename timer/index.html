<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer, Stopwatch and Random Picker — free online</title>
<meta name="description" content="Free online timer, stopwatch and random picker. Count down with a beep, time laps, or pick a random name or number.">
<link rel="canonical" href="https://tools.freenetsave.com/timer/">
<link rel="stylesheet" href="../assets/style.css?v=8">
<style>
  [hidden]{display:none !important}
  .box b{word-break:normal;overflow-wrap:anywhere;font-size:clamp(20px,5.6vw,26px)}
  .box.main b{font-size:clamp(24px,7vw,30px)}
  .lead{color:var(--muted);font-size:15px;margin:0 0 12px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btnrow .btn{width:auto;flex:1;min-width:130px}
  .btn.alt{background:var(--accent)}
  .btn.line{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
  .clock{font-size:clamp(54px,17vw,96px);font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:6px 0}
  .clock.done{color:var(--accent)}
  .t3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  #laps{margin:10px 0 0;padding-left:22px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <div class="hide-embed">
    <h1>Timer, Stopwatch & Picker</h1>
    <p class="sub">Count down, time something, or pick a name or number at random.</p>
  </div>
  <div class="card">
    <div class="seg" id="tab"><button type="button" data-t="timer" class="on">Timer</button><button type="button" data-t="watch">Stopwatch</button><button type="button" data-t="pick">Random picker</button></div>
    <div id="pTimer">
      <div class="clock" id="tc">05:00</div>
      <div class="t3"><div class="field"><label for="th">Hours</label><input id="th" type="number" min="0" inputmode="numeric" value="0"></div><div class="field"><label for="tm">Minutes</label><input id="tm" type="number" min="0" inputmode="numeric" value="5"></div><div class="field"><label for="ts">Seconds</label><input id="ts" type="number" min="0" inputmode="numeric" value="0"></div></div>
      <div class="btnrow"><button class="btn" id="tgo" type="button">Start</button><button class="btn line" id="trs" type="button">Reset</button></div>
    </div>
    <div id="pWatch" hidden>
      <div class="clock" id="wc">00:00.0</div>
      <div class="btnrow"><button class="btn" id="wgo" type="button">Start</button><button class="btn line" id="wlap" type="button">Lap</button><button class="btn line" id="wrs" type="button">Reset</button></div>
      <ol id="laps"></ol>
    </div>
    <div id="pPick" hidden>
      <div class="field" style="margin-top:14px"><label for="names">Names or things <small>(one on each line)</small></label><textarea id="names" style="min-height:120px" placeholder="Type one on each line"></textarea></div>
      <div class="row"><div class="field"><label for="lo">Or a number from</label><input id="lo" type="number" inputmode="numeric" value="1"></div><div class="field"><label for="hi">to</label><input id="hi" type="number" inputmode="numeric" value="100"></div></div>
      <div class="result"><div class="box main"><span>Picked</span><b id="pk">–</b></div></div>
      <div class="btnrow"><button class="btn" id="pn" type="button">Pick from the list</button><button class="btn line" id="pr" type="button">Pick a number</button></div>
    </div>
  </div>
  <p class="note">🔒 This tool runs on your device. Nothing you enter is sent or saved.</p>
</div>
<script src="../assets/embed.js?v=12"></script>
<script>
const p2=n=>String(n).padStart(2,"0");
function fmt(s){s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+p2(m)+":"+p2(x);}
$("tab").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#tab button").forEach(x=>x.classList.toggle("on",x===b));
  $("pTimer").hidden=b.dataset.t!=="timer";$("pWatch").hidden=b.dataset.t!=="watch";$("pPick").hidden=b.dataset.t!=="pick";});
let tEnd=0,tLeft=0,tInt=null;
const total=()=>(+$("th").value||0)*3600+(+$("tm").value||0)*60+(+$("ts").value||0);
function beep(){try{const A=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=880;o.connect(g);g.connect(A.destination);g.gain.setValueAtTime(.25,A.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+t+.3);o.start(A.currentTime+t);o.stop(A.currentTime+t+.3);});}catch(e){}}
function tStop(){clearInterval(tInt);tInt=null;$("tgo").textContent="Start";}
function tTick(){tLeft=(tEnd-Date.now())/1000;$("tc").textContent=fmt(tLeft);if(tLeft<=0){tStop();tLeft=0;$("tc").classList.add("done");$("tc").textContent="Time is up";beep();}}
$("tgo").addEventListener("click",()=>{if(tInt){tStop();return;}if(tLeft<=0)tLeft=total();if(tLeft<=0){toast("Set a time first");return;}
  $("tc").classList.remove("done");tEnd=Date.now()+tLeft*1000;tInt=setInterval(tTick,200);tTick();$("tgo").textContent="Pause";});
function tReset(){tStop();tLeft=0;$("tc").classList.remove("done");$("tc").textContent=fmt(total());}
$("trs").addEventListener("click",tReset);["th","tm","ts"].forEach(i=>$(i).addEventListener("input",()=>{if(!tInt)tReset();}));
let w0=0,wAcc=0,wInt=null;const wNow=()=>wAcc+(wInt?Date.now()-w0:0);
const wf=ms=>{const s=ms/1000,m=Math.floor(s/60);return p2(m)+":"+p2(Math.floor(s%60))+"."+Math.floor(ms%1000/100);};
$("wgo").addEventListener("click",()=>{if(wInt){wAcc=wNow();clearInterval(wInt);wInt=null;$("wgo").textContent="Start";}else{w0=Date.now();wInt=setInterval(()=>$("wc").textContent=wf(wNow()),100);$("wgo").textContent="Pause";}});
$("wlap").addEventListener("click",()=>{if(wNow()>0){const li=document.createElement("li");li.textContent=wf(wNow());$("laps").appendChild(li);}});
$("wrs").addEventListener("click",()=>{clearInterval(wInt);wInt=null;wAcc=0;$("wc").textContent="00:00.0";$("laps").innerHTML="";$("wgo").textContent="Start";});
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;};
$("pn").addEventListener("click",()=>{const l=$("names").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!l.length){toast("Type some names first");return;}$("pk").textContent=l[rnd(l.length)];});
$("pr").addEventListener("click",()=>{let a=parseInt($("lo").value,10),b=parseInt($("hi").value,10);if(isNaN(a)||isNaN(b)){toast("Type two numbers");return;}if(a>b)[a,b]=[b,a];$("pk").textContent=a+rnd(b-a+1);});
tReset();
</script>
</body>
</html>
