<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Maker — free invoice or receipt to print or save as PDF</title>
<meta name="description" content="Free invoice and receipt maker. Type your items, add tax, then print it or save it as a PDF. No sign-up, and nothing you type is saved or sent.">
<link rel="canonical" href="https://tools.freenetsave.com/invoice-maker/">
<link rel="stylesheet" href="../assets/style.css?v=7">
<style>
  [hidden]{display:none !important}
  .box b{word-break:normal;overflow-wrap:anywhere;font-size:clamp(20px,5.6vw,26px)}
  .box.main b{font-size:clamp(24px,7vw,30px)}
  .lead{color:var(--muted);font-size:15px;margin:0 0 12px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btnrow .btn{width:auto;flex:1;min-width:130px}
  .btn.alt{background:var(--accent)}
  .btn.line{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
  #sheet{background:#fff;color:#000;border:1px solid var(--line);border-radius:6px;padding:26px;margin-top:16px;overflow-x:auto}
  @media print{body{background:#fff}.card,.hide-embed,.note,.fh,.ff{display:none!important}.wrap{max-width:none;padding:0}#sheet{border:0;padding:0;margin:0;overflow:visible}@page{margin:14mm}}
  .it{display:grid;grid-template-columns:1fr 64px 96px 38px;gap:6px;margin-bottom:6px}
  .it input{padding:10px 8px;font-size:16px}
  .it button{border:1.5px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-size:16px}
  #sheet h2{margin:0;font-size:28px;letter-spacing:.02em}
  #sheet table{width:100%;border-collapse:collapse;margin-top:18px;font-size:15px}
  #sheet th{text-align:left;border-bottom:2px solid #000;padding:6px 4px}
  #sheet td{border-bottom:1px solid #ccc;padding:7px 4px;vertical-align:top}
  #sheet .r{text-align:right;white-space:nowrap}
  #sheet .tot td{border:0;padding:4px}
  #sheet .grand td{font-weight:800;font-size:18px;border-top:2px solid #000}
  .two{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:14px;font-size:15px;white-space:pre-line}
</style>
</head>
<body>
<div class="wrap">
  <div class="hide-embed">
    <h1>Invoice & Receipt Maker</h1>
    <p class="sub">Type your items, add tax, then print or save as a PDF.</p>
  </div>
  <div class="card">
    <div class="field"><div class="seg" id="kind"><button type="button" data-k="INVOICE" class="on">Invoice</button><button type="button" data-k="RECEIPT">Receipt</button><button type="button" data-k="QUOTE">Quote</button></div></div>
    <div class="row"><div class="field"><label for="from">From <small>(your business)</small></label><textarea id="from" style="min-height:80px" placeholder="Business name, address, phone"></textarea></div>
    <div class="field"><label for="to">To <small>(customer)</small></label><textarea id="to" style="min-height:80px" placeholder="Customer name and address"></textarea></div></div>
    <div class="row"><div class="field"><label for="no">Number</label><input id="no" placeholder="e.g. 1001"></div><div class="field"><label for="dt">Date</label><input id="dt" type="date"></div></div>
    <label>Items <small>(what, how many, price each)</small></label>
    <div id="items"></div>
    <button class="btn ghost" id="add" type="button">+ Add an item</button>
    <div class="row" style="margin-top:14px"><div class="field"><label for="tax">Tax % <small>(optional)</small></label><input id="tax" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div>
    <div class="field"><label for="cur">Money sign</label><select id="cur"><option value="$">$</option><option value="€">€</option><option value="£">£</option><option value="₹">₹</option><option value="">none</option></select></div></div>
    <div class="field"><label for="notes">Notes <small>(optional)</small></label><input id="notes" placeholder="Payment terms, thank you note"></div>
    <button class="btn" id="print" type="button">Print or save as PDF</button>
    <p class="lead" style="margin-top:8px">To save a PDF, choose "Save as PDF" as the printer.</p>
  </div>
  <div id="sheet"></div>
  <p class="note">🔒 This tool runs on your device. Nothing you enter is sent or saved.</p>
</div>
<script src="../assets/embed.js?v=7"></script>
<script>
let K="INVOICE";const E=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const f=x=>$("cur").value+x.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2});
function addItem(){const d=document.createElement("div");d.className="it";d.innerHTML='<input placeholder="Item or service" aria-label="Item"><input type="number" inputmode="decimal" min="0" value="1" aria-label="How many"><input type="number" inputmode="decimal" min="0" step="0.01" placeholder="Price" aria-label="Price each"><button type="button" aria-label="Remove item">✕</button>';
  d.querySelector("button").addEventListener("click",()=>{if($("items").children.length>1){d.remove();draw();}});$("items").appendChild(d);}
function draw(){let sub=0,rows="";[...$("items").children].forEach(d=>{const i=d.querySelectorAll("input"),n=i[0].value.trim(),q=+i[1].value||0,p=+i[2].value||0;if(!n&&!p)return;sub+=q*p;rows+="<tr><td>"+E(n)+'</td><td class="r">'+q+'</td><td class="r">'+f(p)+'</td><td class="r">'+f(q*p)+"</td></tr>";});
  const t=+$("tax").value||0,tax=sub*t/100;
  $("sheet").innerHTML='<div class="two"><h2>'+K+'</h2><div class="r">'+($("no").value?"No. "+E($("no").value)+"\n":"")+E($("dt").value)+'</div></div><div class="two"><div><b>From</b>\n'+E($("from").value)+'</div><div><b>To</b>\n'+E($("to").value)+'</div></div><table><tr><th>Item</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr>'+(rows||'<tr><td colspan="4">&nbsp;</td></tr>')+'<tr class="tot"><td colspan="3" class="r">Subtotal</td><td class="r">'+f(sub)+"</td></tr>"+(t?'<tr class="tot"><td colspan="3" class="r">Tax ('+t+'%)</td><td class="r">'+f(tax)+"</td></tr>":"")+'<tr class="tot grand"><td colspan="3" class="r">Total</td><td class="r">'+f(sub+tax)+"</td></tr></table>"+($("notes").value?'<p style="margin-top:18px">'+E($("notes").value)+"</p>":"");}
$("kind").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;K=b.dataset.k;document.querySelectorAll("#kind button").forEach(x=>x.classList.toggle("on",x===b));draw();});
$("add").addEventListener("click",()=>{addItem();draw();});document.querySelector(".card").addEventListener("input",draw);
$("print").addEventListener("click",()=>window.print());
(function(){const t=new Date();$("dt").value=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");})();addItem();draw();
</script>
</body>
</html>
