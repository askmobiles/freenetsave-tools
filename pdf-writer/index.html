<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Writer — type text and save as PDF (free) — freenetsave.com</title>
<meta name="description" content="Free online PDF writer. Type or paste your text, pick a font and page size, and save it as a clean PDF. Nothing is uploaded or saved.">
<link rel="canonical" href="https://freenetsave.com/pdf-writer/">
<link rel="stylesheet" href="../assets/style.css?v=8">
<style>#txt{min-height:300px;font-size:17px;line-height:1.5}</style>
</head>
<body>
<div class="wrap">
  <div class="hide-embed">
    <h1>PDF writer</h1>
    <p class="sub">Type or paste your text, then save it as a PDF.</p>
  </div>
  <div class="card">
    <div class="field">
      <label for="title">Title <small>(optional)</small></label>
      <input id="title" placeholder="e.g. Letter to my landlord">
    </div>
    <div class="field">
      <label for="txt">Your text</label>
      <textarea id="txt" placeholder="Start typing here. Leave an empty line to start a new paragraph."></textarea>
    </div>
    <div class="opts2">
      <div class="field" style="margin:0"><label for="font">Font</label>
        <select id="font"><option value="Helvetica">Clean (Helvetica)</option><option value="TimesRoman">Classic (Times)</option><option value="Courier">Typewriter (Courier)</option></select></div>
      <div class="field" style="margin:0"><label for="fs">Text size</label>
        <select id="fs"><option value="11">Small</option><option value="12" selected>Normal</option><option value="14">Large</option><option value="16">Extra large</option></select></div>
      <div class="field" style="margin:0"><label for="page">Page size</label>
        <select id="page"><option value="letter" selected>Letter (Canada, USA)</option><option value="a4">A4 (most other countries)</option></select></div>
      <div class="field" style="margin:0"><label for="date">Add today's date</label>
        <select id="date"><option value="no">No</option><option value="yes">Yes, under the title</option></select></div>
    </div>
    <div class="field" style="margin-top:14px"><label for="fname">File name</label><input id="fname" value="my-document"></div>
    <div class="actions"><button class="btn" id="go" style="flex:1">Save as PDF</button></div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <p class="note">🔒 Your PDF is made inside your browser. Your text is never sent or saved.<br>
    <a href="https://freenetsave.com/" target="_top">freenetsave.com</a> · free online tools</p>
</div>
<script src="../assets/embed.js?v=12"></script>
<script src="../assets/lib/pdf-lib.min.js"></script>
<script>
const SIZES = { letter:[612,792], a4:[595.28,841.89] };
const BOLD = { Helvetica:"HelveticaBold", TimesRoman:"TimesRomanBold", Courier:"CourierBold" };
// Characters the built-in PDF fonts can show (Latin letters, accents, common symbols)
const OK = /[ -~ -ÿ‘’“”–—…€•™ŒœŠšŸŽžƒˆ˜†‡‰‹›‚„]/;
function clean(s){ let bad = 0; const out = [...s.replace(/\t/g,"    ")].map(c=> c==="\n"||OK.test(c) ? c : (bad++, "?")).join(""); return {out, bad}; }

function wrap(text, font, size, width){
  const lines = [];
  text.split("\n").forEach(par=>{
    if(!par.trim()){ lines.push(""); return; }
    let line = "";
    par.split(/(\s+)/).forEach(word=>{
      const test = line + word;
      if(font.widthOfTextAtSize(test.trimEnd(), size) <= width || !line.trim()){
        // very long single word: break it
        if(font.widthOfTextAtSize(test, size) > width && !line.trim()){
          let w = "";
          for(const ch of word){ if(font.widthOfTextAtSize(w+ch,size) > width){ lines.push(w); w = ch; } else w += ch; }
          line = w;
        } else line = test;
      } else { lines.push(line.trimEnd()); line = word.trimStart(); }
    });
    lines.push(line.trimEnd());
  });
  return lines;
}

$("go").addEventListener("click", async ()=>{
  const t = clean($("title").value.trim()), b = clean($("txt").value);
  if(!t.out && !b.out.trim()){ $("status").innerHTML = `<span class="bad">Type some text first.</span>`; return; }
  const pdf = await PDFLib.PDFDocument.create();
  const fKey = $("font").value;
  const font = await pdf.embedFont(PDFLib.StandardFonts[fKey]);
  const bold = await pdf.embedFont(PDFLib.StandardFonts[BOLD[fKey]]);
  const size = +$("fs").value, lh = size*1.45;
  const [pw, ph] = SIZES[$("page").value], m = 72, width = pw - 2*m;
  let page = pdf.addPage([pw,ph]), y = ph - m;
  const newPage = ()=>{ page = pdf.addPage([pw,ph]); y = ph - m; };
  const ink = PDFLib.rgb(0.09,0.13,0.2);
  if(t.out){
    const ts = size+8;
    wrap(t.out, bold, ts, width).forEach(l=>{ page.drawText(l,{x:m,y:y-ts,size:ts,font:bold,color:ink}); y -= ts*1.3; });
    y -= 4;
  }
  if($("date").value==="yes"){
    const d = new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
    const dc = clean(d).out;
    page.drawText(dc,{x:m,y:y-size,size:size,font,color:PDFLib.rgb(.36,.42,.52)}); y -= lh*2;
  } else if(t.out) y -= lh*0.6;
  wrap(b.out, font, size, width).forEach(l=>{
    if(y - lh < m) newPage();
    if(l) page.drawText(l,{x:m,y:y-size,size,font,color:ink});
    y -= lh;
  });
  // page numbers
  const pages = pdf.getPages();
  if(pages.length>1) pages.forEach((p,i)=>{ const s=`${i+1} / ${pages.length}`; p.drawText(s,{x:pw/2-font.widthOfTextAtSize(s,9)/2,y:36,size:9,font,color:PDFLib.rgb(.5,.55,.62)}); });
  pdf.setTitle(t.out || "Document"); pdf.setProducer("freenetsave.com"); pdf.setCreator("freenetsave.com");
  const blob = new Blob([await pdf.save()],{type:"application/pdf"});
  const name = ($("fname").value.trim() || "my-document").replace(/[\\/:*?"<>|]+/g,"-");
  saveFile(blob, name.toLowerCase().endsWith(".pdf") ? name : name+".pdf");
  const bad = t.bad + b.bad;
  $("status").innerHTML = `✅ Saved — ${pages.length} page${pages.length>1?"s":""}, ${fmtSize(blob.size)}.` + (bad ? `<br><span class="bad">${bad} character${bad>1?"s":""} (like emoji or non-Latin letters) can't be shown in these fonts and became “?”.</span>` : "");
});
</script>
</body>
</html>
