<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make a PDF Smaller — compress PDF (free) — freenetsave.com</title>
<meta name="description" content="Free PDF compressor. Make a PDF smaller to email or upload it. Choose light, medium or strong. Your file never leaves your device.">
<link rel="canonical" href="https://freenetsave.com/make-pdf-smaller/">
<link rel="stylesheet" href="../assets/style.css?v=8">
</head>
<body>
<div class="wrap">
  <div class="hide-embed">
    <h1>Make a PDF smaller</h1>
    <p class="sub">Shrink a PDF so you can email or upload it.</p>
  </div>
  <div class="card">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a PDF">
      <div style="font-size:34px">📉</div>
      <b>Choose a PDF or drop it here</b>
      <span id="fileInfo">One PDF at a time</span>
      <div class="pick">Choose PDF</div>
      <input type="file" accept="application/pdf,.pdf">
    </div>
    <div class="field" style="margin-top:16px">
      <label>How much smaller?</label>
      <div class="seg" id="level">
        <button type="button" data-l="light">Light<br><small style="font-weight:400">Keeps text sharp</small></button>
        <button type="button" data-l="medium" class="on">Medium<br><small style="font-weight:400">Best for scans</small></button>
        <button type="button" data-l="strong">Strong<br><small style="font-weight:400">Smallest file</small></button>
      </div>
      <p style="font-size:14px;color:var(--muted);margin:8px 0 0" id="levelNote"></p>
    </div>
    <div class="actions">
      <button class="btn" id="go" disabled style="flex:1">Make smaller</button>
    </div>
    <div class="bar" id="bar"><i></i></div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <p class="note">🔒 Your PDF is processed inside your browser. Nothing is uploaded or saved.<br>
    <a href="https://freenetsave.com/" target="_top">freenetsave.com</a> · free online tools</p>
</div>
<script src="../assets/embed.js?v=12"></script>
<script src="../assets/lib/pdf-lib.min.js"></script>
<script type="module">
import * as pdfjsLib from "../assets/lib/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = new URL("../assets/lib/pdf.worker.min.mjs", import.meta.url).href;

const NOTES = {
  light: "Tidies the file without touching how it looks. Text stays sharp and searchable. Saves a little.",
  medium: "Redraws each page as a clear picture (150 dpi). Great for scans and photos. Text can't be selected afterwards.",
  strong: "Smallest file (100 dpi). Good for forms and uploads with size limits. Small text may look softer."
};
let file = null, bytes = null, level = "medium";
const setNote = ()=> $("levelNote").textContent = NOTES[level];
setNote();
$("level").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  level = b.dataset.l; document.querySelectorAll("#level button").forEach(x=>x.classList.toggle("on", x===b)); setNote();
});
setupDrop($("drop"), async files=>{
  const f = files.find(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name));
  if(!f){ $("status").innerHTML = `<span class="bad">Please choose a PDF file.</span>`; return; }
  file = f; bytes = new Uint8Array(await f.arrayBuffer());
  $("fileInfo").innerHTML = `<b style="font-size:15px">${f.name.replace(/</g,"&lt;")}</b> · ${fmtSize(f.size)}`;
  $("go").disabled = false; $("status").textContent = "";
});
const bar = p => $("bar").firstElementChild.style.width = Math.round(p*100)+"%";

async function light(){
  const d = await PDFLib.PDFDocument.load(bytes, {updateMetadata:false});
  return await d.save({useObjectStreams:true});
}
async function asPictures(dpi, q){
  const task = pdfjsLib.getDocument({data: bytes.slice()}); const src = await task.promise;
  const out = await PDFLib.PDFDocument.create();
  for(let n=1; n<=src.numPages; n++){
    $("status").textContent = `Page ${n} of ${src.numPages}…`; bar((n-1)/src.numPages);
    const page = await src.getPage(n);
    const base = page.getViewport({scale:1});              // size in points
    const vp = page.getViewport({scale: dpi/72});
    const c = document.createElement("canvas"); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    const ctx = c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",q));
    const img = await out.embedJpg(new Uint8Array(await blob.arrayBuffer()));
    const p = out.addPage([base.width, base.height]);
    p.drawImage(img,{x:0,y:0,width:base.width,height:base.height});
    c.width = c.height = 0; page.cleanup();
  }
  await task.destroy();
  out.setProducer("freenetsave.com"); out.setCreator("freenetsave.com");
  return await out.save({useObjectStreams:true});
}

$("go").addEventListener("click", async ()=>{
  $("go").disabled = true; $("bar").style.display="block"; bar(0);
  try{
    const outBytes = level==="light" ? await light() : level==="medium" ? await asPictures(150,0.72) : await asPictures(100,0.6);
    bar(1);
    const before = file.size, after = outBytes.length;
    if(after >= before){
      $("status").innerHTML = `This PDF is already as small as it gets with <b>${level}</b> (${fmtSize(before)}). ${level!=="strong" ? "Try a stronger setting." : "It's mostly text, which is already small."}`;
    } else {
      const blob = new Blob([outBytes],{type:"application/pdf"});
      saveFile(blob, baseName(file.name)+"-smaller.pdf");
      $("status").innerHTML = `✅ ${fmtSize(before)} → <b style="color:var(--good)">${fmtSize(after)}</b> (${Math.round((1-after/before)*100)}% smaller). Your PDF is downloading.`;
    }
  }catch(e){
    $("status").innerHTML = /password|encrypt/i.test(e.message||"") ? `<span class="bad">This PDF is locked with a password. Unlock it first.</span>` : `<span class="bad">Couldn't read this PDF: ${e.message||e}</span>`;
  }
  $("go").disabled = false; setTimeout(()=>$("bar").style.display="none", 800);
});
</script>
</body>
</html>
