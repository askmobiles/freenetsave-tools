<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit Converter — length, weight, temperature, cooking (free)</title>
<meta name="description" content="Free unit converter for length, weight, temperature, volume, cooking, area, speed and data. Type a number and see the answer right away.">
<link rel="canonical" href="https://tools.freenetsave.com/unit-converter/">
<link rel="stylesheet" href="../assets/style.css?v=8">
<style>
  [hidden]{display:none !important}
  .box b{word-break:normal;overflow-wrap:anywhere;font-size:clamp(20px,5.6vw,26px)}
  .box.main b{font-size:clamp(24px,7vw,30px)}
  .lead{color:var(--muted);font-size:15px;margin:0 0 12px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btnrow .btn{width:auto;flex:1;min-width:130px}
  .btn.alt{background:var(--accent)}
  .btn.line{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}

</style>
</head>
<body>
<div class="wrap">
  <div class="hide-embed">
    <h1>Unit Converter</h1>
    <p class="sub">Length, weight, temperature, cooking and more.</p>
  </div>
  <div class="card">
    <div class="field"><label for="cat">What are you converting?</label><select id="cat"></select></div>
    <div class="row"><div class="field"><label for="val">Amount</label><input id="val" type="number" inputmode="decimal" placeholder="Type a number"></div>
    <div class="field"><label for="from">From</label><select id="from"></select></div></div>
    <div class="field"><label for="to">To</label><select id="to"></select></div>
    <div class="result"><div class="box main"><span id="lbl">Answer</span><b id="out">–</b></div></div>
    <div class="btnrow"><button class="btn line" id="swap" type="button">Swap</button><button class="btn line" id="copy" type="button">Copy answer</button></div>
  </div>
  <p class="note">🔒 This tool runs on your device. Nothing you enter is sent or saved.</p>
</div>
<script src="../assets/embed.js?v=8"></script>
<script>
const U={
 "Length":{mm:.001,cm:.01,m:1,km:1000,inch:.0254,foot:.3048,yard:.9144,mile:1609.344},
 "Weight":{mg:1e-6,g:.001,kg:1,tonne:1000,ounce:.028349523125,pound:.45359237,stone:6.35029318},
 "Volume & cooking":{mL:.001,L:1,"teaspoon (US)":.00492892159375,"tablespoon (US)":.01478676478125,"cup (US)":.2365882365,"fluid ounce (US)":.0295735295625,"pint (US)":.473176473,"quart (US)":.946352946,"gallon (US)":3.785411784,"gallon (UK)":4.54609},
 "Area":{"sq cm":1e-4,"sq m":1,"sq km":1e6,hectare:1e4,"sq inch":.00064516,"sq foot":.09290304,"sq yard":.83612736,acre:4046.8564224,"sq mile":2589988.110336},
 "Speed":{"m/s":1,"km/h":1/3.6,mph:.44704,knot:1852/3600},
 "Data":{KB:1e3,MB:1e6,GB:1e9,TB:1e12,"KiB":1024,"MiB":1048576,"GiB":1073741824},
 "Time":{second:1,minute:60,hour:3600,day:86400,week:604800},
 "Temperature":{"°C":0,"°F":0,K:0}};
function fill(){const c=U[$("cat").value],ks=Object.keys(c);["from","to"].forEach((id,i)=>{$(id).innerHTML=ks.map(k=>"<option>"+k+"</option>").join("");$(id).selectedIndex=i;});calc();}
function nice(x){if(!isFinite(x))return "–";const a=Math.abs(x);if(a!==0&&(a<1e-6||a>=1e15))return x.toExponential(6);return String(parseFloat(x.toPrecision(10)));}
function calc(){const v=parseFloat($("val").value),f=$("from").value,t=$("to").value,cat=$("cat").value;let r;
  if(isNaN(v)){$("out").textContent="–";$("lbl").textContent="Answer";return;}
  if(cat==="Temperature"){const c=f==="°C"?v:f==="°F"?(v-32)*5/9:v-273.15;r=t==="°C"?c:t==="°F"?c*9/5+32:c+273.15;}
  else r=v*U[cat][f]/U[cat][t];
  $("out").textContent=nice(r)+" "+t;$("lbl").textContent=nice(v)+" "+f+" =";}
$("cat").innerHTML=Object.keys(U).map(k=>"<option>"+k+"</option>").join("");
$("cat").addEventListener("change",fill);["val","from","to"].forEach(i=>$(i).addEventListener("input",calc));
$("swap").addEventListener("click",()=>{const a=$("from").selectedIndex;$("from").selectedIndex=$("to").selectedIndex;$("to").selectedIndex=a;calc();});
$("copy").addEventListener("click",()=>$("out").textContent!=="–"?copyText($("lbl").textContent+" "+$("out").textContent):toast("Type a number first"));
fill();
</script>
</body>
</html>
