<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel Cost Calculator — gas cost for a trip (free)</title>
<meta name="description" content="Free fuel cost calculator. Work out how much gas a trip will use and what it will cost, in kilometres or miles, and split it between people.">
<link rel="canonical" href="https://tools.freenetsave.com/fuel-cost/">
<link rel="stylesheet" href="../assets/style.css?v=8">
<style>
  [hidden]{display:none !important}
  .box b{word-break:normal;overflow-wrap:anywhere;font-size:clamp(20px,5.6vw,26px)}
  .box.main b{font-size:clamp(24px,7vw,30px)}
  .lead{color:var(--muted);font-size:15px;margin:0 0 12px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btnrow .btn{width:auto;flex:1;min-width:130px}
  .btn.alt{background:var(--accent)}
  .btn.line{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}

</style>
</head>
<body>
<div class="wrap">
  <div class="hide-embed">
    <h1>Fuel Cost Calculator</h1>
    <p class="sub">What a trip costs in gas, and each person's share.</p>
  </div>
  <div class="card">
    <div class="field"><label>Units</label><div class="seg" id="unit"><button type="button" data-u="m" class="on">Kilometres and litres</button><button type="button" data-u="us">Miles and US gallons</button></div></div>
    <div class="row"><div class="field"><label for="dist" id="dL">Trip distance (km)</label><input id="dist" type="number" inputmode="decimal" min="0" placeholder="Distance one way"></div>
    <div class="field"><label for="eff" id="eL">Fuel use (L per 100 km)</label><input id="eff" type="number" inputmode="decimal" min="0" step="0.1" placeholder="From your car's display"></div></div>
    <div class="row"><div class="field"><label for="price" id="pL">Fuel price (per litre)</label><input id="price" type="number" inputmode="decimal" min="0" step="0.001" placeholder="Price at the pump"></div>
    <div class="field"><label for="ppl">People sharing the cost</label><input id="ppl" type="number" inputmode="numeric" min="1" value="1"></div></div>
    <div class="field"><label><input type="checkbox" id="rt" style="width:auto;margin-right:8px">Round trip (there and back)</label></div>
    <div class="result"><div class="box main"><span>Fuel cost</span><b id="cost">–</b></div><div class="box"><span>Fuel used</span><b id="used">–</b></div><div class="box"><span>Each person pays</span><b id="each">–</b></div></div>
    <div class="actions"><button class="btn ghost" type="button" id="copy">Copy result</button></div>
  </div>
  <p class="note">🔒 This tool runs on your device. Nothing you enter is sent or saved.</p>
</div>
<script src="../assets/embed.js?v=8"></script>
<script>
let Un="m",last="";const f=x=>x.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2});
function calc(){let d=+$("dist").value||0;const e=+$("eff").value||0,p=+$("price").value||0,n=Math.max(1,parseInt($("ppl").value,10)||1);last="";
  if($("rt").checked)d*=2;if(!d||!e||!p){["cost","used","each"].forEach(k=>$(k).textContent="–");return;}
  const used=Un==="m"?d*e/100:d/e,c=used*p;$("cost").textContent=f(c);$("used").textContent=f(used)+(Un==="m"?" L":" gal");$("each").textContent=f(c/n);
  last="Trip: "+d+(Un==="m"?" km":" miles")+"\nFuel used: "+f(used)+(Un==="m"?" L":" gal")+"\nFuel cost: "+f(c)+"\nEach of "+n+": "+f(c/n)+"\n(freenetsave.com)";}
$("unit").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;Un=b.dataset.u;document.querySelectorAll("#unit button").forEach(x=>x.classList.toggle("on",x===b));
  $("dL").textContent=Un==="m"?"Trip distance (km)":"Trip distance (miles)";$("eL").textContent=Un==="m"?"Fuel use (L per 100 km)":"Fuel economy (miles per gallon)";$("pL").textContent=Un==="m"?"Fuel price (per litre)":"Fuel price (per gallon)";calc();});
["dist","eff","price","ppl","rt"].forEach(k=>$(k).addEventListener("input",calc));
$("copy").addEventListener("click",()=>last?copyText(last):toast("Fill in the boxes first"));
</script>
</body>
</html>
