<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Calculator &amp; Bill Splitter (free) — freenetsave.com</title>
<meta name="description" content="Free tip calculator and bill splitter. Pick a tip, split the bill between friends, and see what each person pays. Nothing is saved.">
<link rel="canonical" href="https://freenetsave.com/tip-calculator/">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap">
  <div class="hide-embed">
    <h1>Tip Calculator &amp; Bill Splitter</h1>
    <p class="sub">Work out the tip and what each person pays.</p>
  </div>
  <div class="card">
    <div class="row">
      <div class="field">
        <label for="bill">Bill amount ($)</label>
        <input id="bill" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 86.40">
      </div>
      <div class="field">
        <label for="people">Number of people</label>
        <input id="people" type="number" inputmode="numeric" min="1" step="1" value="1">
      </div>
    </div>
    <div class="field">
      <label>Tip</label>
      <div class="seg" id="tips">
        <button type="button" data-t="10">10%</button>
        <button type="button" data-t="15" class="on">15%</button>
        <button type="button" data-t="18">18%</button>
        <button type="button" data-t="20">20%</button>
        <button type="button" data-t="custom">Other</button>
      </div>
    </div>
    <div class="field" id="customBox" style="display:none">
      <label for="custom">Your tip (%)</label>
      <input id="custom" type="number" inputmode="decimal" min="0" step="0.5" placeholder="e.g. 12">
    </div>
    <div class="field">
      <label><input type="checkbox" id="round" style="width:auto;margin-right:6px">Round each person up to the next dollar</label>
    </div>
    <div class="result">
      <div class="box"><span>Tip</span><b id="tip">–</b></div>
      <div class="box"><span>Total</span><b id="total">–</b></div>
      <div class="box main"><span>Each person pays</span><b id="each">–</b></div>
    </div>
    <div class="actions"><button class="btn ghost" type="button" id="copy">📋 Copy</button></div>
  </div>
  <p class="note">🔒 Works in your browser. Nothing you type is sent or saved.<br>
    <a href="https://freenetsave.com/" target="_top">freenetsave.com</a> · free online tools</p>
</div>
<script src="../assets/embed.js"></script>
<script>
let tipPct = 15;
function pct(){ return tipPct==="custom" ? parseFloat($("custom").value) : tipPct; }
function calc(){
  const bill = parseFloat($("bill").value), n = Math.max(1, parseInt($("people").value)||1), p = pct();
  if(!(bill>=0) || !(p>=0)){ ["tip","total","each"].forEach(i=>$(i).textContent="–"); return; }
  const tip = Math.round(bill*p)/100;
  let total = bill + tip, each = total/n;
  if($("round").checked){ each = Math.ceil(each); total = each*n; }
  $("tip").textContent = money(tip);
  $("total").textContent = money(total);
  $("each").textContent = money(Math.ceil(Math.round(each*1e6)/1e4)/100);
}
$("tips").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  tipPct = b.dataset.t==="custom" ? "custom" : +b.dataset.t;
  document.querySelectorAll("#tips button").forEach(x=>x.classList.toggle("on", x===b));
  $("customBox").style.display = tipPct==="custom" ? "" : "none";
  calc();
});
["bill","people","custom","round"].forEach(i=>$(i).addEventListener("input", calc));
$("copy").addEventListener("click", ()=> copyText(`Tip: ${$("tip").textContent}\nTotal: ${$("total").textContent}\nEach person: ${$("each").textContent}`));
calc();
</script>
</body>
</html>
